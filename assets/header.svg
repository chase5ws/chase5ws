  @keyframes glitch1 { 0%,88%,100% { opacity: 0; transform: translate(0,0) } 89% { opacity: .8; transform: translate(-6px,2px) } 91% { opacity: .8; transform: translate(4px,-2px) } 93% { opacity: 0 } }
  @keyframes glitch2 { 0%,88%,100% { opacity: 0; transform: translate(0,0) } 89% { opacity: .8; transform: translate(6px,-2px) } 91% { opacity: .8; transform: translate(-4px,2px) } 93% { opacity: 0 } }
  .role { font: 600 24px 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #e0e7ff; text-anchor: middle; opacity: 0; animation: role 12.8s ease-in-out infinite; }
  @keyframes role { 0% { opacity: 0; transform: translateY(8px) } 4% { opacity: 1; transform: translateY(0) } 21.0% { opacity: 1; transform: translateY(0) } 25.0% { opacity: 0; transform: translateY(-8px) } 100% { opacity: 0 } }
  .tag { font: 500 15px 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #94a3b8; text-anchor: middle; letter-spacing: 3px; }
  .scan { animation: scan 7s linear infinite; }
  @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(380px) } }
  .chev { font: 700 24px 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #22d3ee; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
</style>
