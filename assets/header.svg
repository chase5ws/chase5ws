<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Chase Tseng — Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01030c"/>
      <stop offset="0.55" stop-color="#04112e"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#0a5cff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#0a2a7a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#bff6ff"/>
      <stop offset="1" stop-color="#3fa9ff"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0e2a63" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00e5ff" opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floorClip"><rect x="0" y="262" width="1200" height="98"/></clipPath>
    <clipPath id="typeClip"><rect x="300" y="222" width="0" height="30">
      <animate attributeName="width" values="0;600;600" keyTimes="0;0.35;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .name{font-family:'Orbitron','Rajdhani','Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:900;letter-spacing:14px}
      .g1{animation:g1 4s steps(1) infinite}
      .g2{animation:g2 4s steps(1) infinite}
      @keyframes g1{0%,86%,100%{transform:translate(-3px,0)}88%{transform:translate(-12px,-2px)}90%{transform:translate(6px,3px)}92%{transform:translate(-7px,0)}}
      @keyframes g2{0%,86%,100%{transform:translate(3px,0)}88%{transform:translate(11px,2px)}90%{transform:translate(-6px,-3px)}92%{transform:translate(8px,1px)}}
      .slice{animation:slice 4s steps(1) infinite;opacity:0}
      @keyframes slice{0%,87%,94%,100%{opacity:0}88%,91%{opacity:1}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .flow{stroke-dasharray:6 14;animation:flow 1.6s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-40}}
      .spin{transform-origin:600px 150px;animation:spin 40s linear infinite}
      .spinr{transform-origin:600px 150px;animation:spin 28s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .rain{animation:rain 9s linear infinite}
      .rain2{animation:rain 13s linear infinite}
      @keyframes rain{from{transform:translateY(-200px)}to{transform:translateY(0)}}
      .floor{animation:floor 1.4s linear infinite}
      @keyframes floor{from{transform:translateY(0)}to{transform:translateY(16px)}}
      .sweep{animation:sweep 5s ease-in-out infinite}
      @keyframes sweep{0%{transform:translateX(-700px)}100%{transform:translateX(700px)}}
      .role{opacity:0;animation:role 9s infinite}
      .r2{animation-delay:3s}.r3{animation-delay:6s}
      @keyframes role{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
    </style>
  </defs>

  <!-- base -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#halo)"/>

  <!-- data rain -->
  <g class="mono" font-size="11" fill="#1f6bff" opacity="0.35">
    <g class="rain">
      <text x="40" y="0">0x3F</text><text x="40" y="40">0xA9</text><text x="40" y="80">0x1C</text><text x="40" y="120">0xFF</text><text x="40" y="160">0x07</text><text x="40" y="200">0xB2</text><text x="40" y="240">0x4E</text><text x="40" y="280">0xD0</text><text x="40" y="320">0x9A</text><text x="40" y="360">0x2B</text><text x="40" y="400">0x6C</text><text x="40" y="440">0xE1</text><text x="40" y="480">0x58</text><text x="40" y="520">0x33</text>
      <text x="1128" y="20">1011</text><text x="1128" y="60">0110</text><text x="1128" y="100">1110</text><text x="1128" y="140">0001</text><text x="1128" y="180">1001</text><text x="1128" y="220">0111</text><text x="1128" y="260">1100</text><text x="1128" y="300">0101</text><text x="1128" y="340">1010</text><text x="1128" y="380">0011</text><text x="1128" y="420">1111</text><text x="1128" y="460">0100</text><text x="1128" y="500">1000</text><text x="1128" y="540">0010</text>
    </g>
    <g class="rain2" fill="#00e5ff" opacity="0.6">
      <text x="88" y="10">mov</text><text x="88" y="70">eax</text><text x="88" y="130">jmp</text><text x="88" y="190">ret</text><text x="88" y="250">def</text><text x="88" y="310">fn</text><text x="88" y="370">int</text><text x="88" y="430">git</text><text x="88" y="490">npm</text>
      <text x="1084" y="30">{ }</text><text x="1084" y="90">=&gt;</text><text x="1084" y="150">::</text><text x="1084" y="210">&amp;&amp;</text><text x="1084" y="270">!=</text><text x="1084" y="330">[ ]</text><text x="1084" y="390">0x</text><text x="1084" y="450">//</text><text x="1084" y="510">&lt;/&gt;</text>
    </g>
  </g>

  <!-- HUD rings -->
  <g fill="none" stroke="#00e5ff">
    <g class="spin" opacity="0.28">
      <circle cx="600" cy="150" r="150" stroke-width="1" stroke-dasharray="2 10"/>
      <circle cx="600" cy="150" r="172" stroke-width="2" stroke-dasharray="60 30 10 30" stroke="#1f6bff"/>
    </g>
    <g class="spinr" opacity="0.22">
      <circle cx="600" cy="150" r="126" stroke-width="1" stroke-dasharray="120 40"/>
      <path d="M600 -30 L600 0 M600 300 L600 330 M420 150 L450 150 M750 150 L780 150" stroke-width="2"/>
    </g>
  </g>

  <!-- circuit traces -->
  <g fill="none" stroke-width="1.6">
    <path d="M150 70 H300 L330 100 H380" stroke="#0f3d8a"/>
    <path d="M150 70 H300 L330 100 H380" stroke="#00e5ff" class="flow"/>
    <path d="M1050 70 H900 L870 100 H820" stroke="#0f3d8a"/>
    <path d="M1050 70 H900 L870 100 H820" stroke="#00e5ff" class="flow"/>
    <path d="M150 200 H260 L290 230" stroke="#0f3d8a"/>
    <path d="M1050 200 H940 L910 230" stroke="#0f3d8a"/>
    <path d="M150 200 H260 L290 230" stroke="#ff2bd6" class="flow" opacity="0.8"/>
    <path d="M1050 200 H940 L910 230" stroke="#ff2bd6" class="flow" opacity="0.8"/>
  </g>
  <g fill="#00e5ff">
    <circle cx="150" cy="70" r="3.5" class="pulse"/><circle cx="1050" cy="70" r="3.5" class="pulse"/>
    <circle cx="380" cy="100" r="3"/><circle cx="820" cy="100" r="3"/>
    <circle cx="150" cy="200" r="3.5" fill="#ff2bd6" class="pulse"/><circle cx="1050" cy="200" r="3.5" fill="#ff2bd6" class="pulse"/>
  </g>

  <!-- perspective floor -->
  <g clip-path="url(#floorClip)" stroke="#00b8ff" fill="none" stroke-width="1" opacity="0.55">
    <g>
      <path d="M600 262 L-600 360 M600 262 L-300 360 M600 262 L0 360 M600 262 L200 360 M600 262 L400 360 M600 262 L520 360 M600 262 L600 360 M600 262 L680 360 M600 262 L800 360 M600 262 L1000 360 M600 262 L1200 360 M600 262 L1500 360 M600 262 L1800 360"/>
    </g>
    <g class="floor">
      <path d="M0 266 H1200 M0 274 H1200 M0 286 H1200 M0 302 H1200 M0 322 H1200 M0 346 H1200 M0 250 H1200"/>
    </g>
  </g>
  <rect x="0" y="262" width="1200" height="98" fill="url(#floorFade)" opacity="0.18"/>
  <rect x="0" y="261" width="1200" height="1.5" fill="url(#beam)"/>

  <!-- name -->
  <g text-anchor="middle">
    <text x="600" y="168" font-size="92" class="name g1" fill="#ff2bd6" opacity="0.75">CHASE TSENG</text>
    <text x="600" y="168" font-size="92" class="name g2" fill="#00e5ff" opacity="0.75">CHASE TSENG</text>
    <text x="600" y="168" font-size="92" class="name" fill="url(#nameFill)" filter="url(#glow)">CHASE TSENG</text>
    <!-- glitch slices -->
    <g class="slice">
      <rect x="250" y="120" width="700" height="8" fill="#00e5ff" opacity="0.6"/>
      <rect x="320" y="146" width="520" height="4" fill="#ff2bd6" opacity="0.7"/>
    </g>
  </g>

  <!-- sweep beam over name -->
  <g opacity="0.35"><rect class="sweep" x="560" y="86" width="80" height="100" fill="url(#beam)" transform="skewX(-20)"/></g>

  <!-- tagline: typing -->
  <g class="mono" font-size="20" font-weight="700" letter-spacing="3" clip-path="url(#typeClip)">
    <text x="600" y="244" text-anchor="middle" fill="#7dd3fc" filter="url(#soft)"><tspan fill="#ff2bd6">&gt;</tspan> SOFTWARE_ENGINEER <tspan fill="#00e5ff">//</tspan> BUILDER.EXE</text>
  </g>

  <!-- rotating stack line -->
  <g class="mono" font-size="14" letter-spacing="2" text-anchor="middle" fill="#9fb8e8">
    <text x="600" y="206" class="role">[ PYTHON · C# · REST API · SQL ]</text>
    <text x="600" y="206" class="role r2">[ AUTOMATION TOOLS · DESKTOP APPS · DATA PIPELINES ]</text>
    <text x="600" y="206" class="role r3">[ SOLIDITY · DISCORD BOTS · x86 ASSEMBLY ]</text>
  </g>

  <!-- HUD corners -->
  <g fill="none" stroke="#00e5ff" stroke-width="2.5" filter="url(#soft)">
    <path d="M20 46 V20 H46"/><path d="M1154 20 H1180 V46"/>
    <path d="M20 314 V340 H46"/><path d="M1154 340 H1180 V314"/>
  </g>

  <!-- HUD labels -->
  <g class="mono" font-size="12" letter-spacing="2">
    <text x="58" y="36" fill="#4f7fd9">[ SYS://PROFILE.INIT ]</text>
    <text x="1142" y="36" fill="#4f7fd9" text-anchor="end">UPLINK <tspan fill="#39ff88" class="blink">●</tspan> ONLINE</text>
    <text x="58" y="334" fill="#4f7fd9">HSINCHU.TW <tspan fill="#00e5ff">//</tspan> 24.80°N 120.97°E</text>
    <text x="1142" y="334" fill="#4f7fd9" text-anchor="end">github.com/chase5ws <tspan fill="#ff2bd6">▮</tspan></text>
  </g>

  <!-- scanlines overlay -->
  <rect width="1200" height="360" fill="url(#scan)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" fill="none" stroke="#0e2a63"/>
</svg>
