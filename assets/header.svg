<style>
  .p { animation-name: float; animation-timing-function: linear; animation-iteration-count: infinite; opacity: 0; }
  @keyframes float { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: .9 } 85% { opacity: .6 } 100% { transform: translateY(-160px); opacity: 0 } }
  .grid { stroke: #c026d3; stroke-opacity: .55; stroke-width: 1.2; }
