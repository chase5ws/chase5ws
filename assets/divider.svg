<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6bff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#1f6bff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="0.8" stop-color="#1f6bff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1f6bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .run{animation:run 3.2s linear infinite}
      @keyframes run{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
      .bl{animation:bl 1.6s ease-in-out infinite}
      @keyframes bl{50%{opacity:.25}}
      .m{font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:10px;letter-spacing:2px}
    </style>
  </defs>
  <g filter="url(#dg)">
    <rect x="0" y="17" width="1200" height="1.4" fill="url(#dl)"/>
    <rect class="run" x="0" y="16.3" width="200" height="2.8" fill="url(#dp)"/>
  </g>
  <g fill="none" stroke="#00e5ff" stroke-width="1.4" filter="url(#dg)">
    <path d="M572 18 L582 8 H618 L628 18 L618 28 H582 Z" fill="#030a1f"/>
    <path d="M520 18 H560 M640 18 H680" stroke="#ff2bd6" class="bl"/>
  </g>
  <text x="600" y="22" text-anchor="middle" class="m" fill="#00e5ff">&lt;/&gt;</text>
  <g fill="#00e5ff" class="bl">
    <rect x="300" y="15" width="5" height="5" transform="rotate(45 302.5 17.5)"/>
    <rect x="895" y="15" width="5" height="5" transform="rotate(45 897.5 17.5)"/>
  </g>
</svg>
