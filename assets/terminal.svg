<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="whoami — Chase Tseng, Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030a1f"/>
      <stop offset="1" stop-color="#020615"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1f4d"/>
      <stop offset="1" stop-color="#061433"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#1f6bff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="tscan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#00e5ff" opacity="0.03"/>
    </pattern>
    <filter id="tglow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="txt" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:14.5px}
      .p{fill:#39ff88}.h{fill:#1f6bff}.c{fill:#e6f6ff}.o{fill:#7dd3fc}.k{fill:#ff2bd6}.s{fill:#ffd166}.d{fill:#5b7bb5}.a{fill:#00e5ff}
      .ln{opacity:0;animation:show .25s ease-out forwards}
      @keyframes show{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .bar{animation:fill 1.4s ease-out forwards;transform-origin:left;transform:scaleX(0)}
      @keyframes fill{to{transform:scaleX(1)}}
    </style>
  </defs>

  <!-- frame -->
  <rect x="6" y="6" width="748" height="388" rx="10" fill="url(#tbg)"/>
  <rect x="6" y="6" width="748" height="388" rx="10" fill="none" stroke="url(#edge)" stroke-width="1.6" filter="url(#tglow)"/>
  <path d="M6 44 V16 Q6 6 16 6 H744 Q754 6 754 16 V44 Z" fill="url(#bar)"/>
  <line x1="6" y1="44" x2="754" y2="44" stroke="#0f3d8a"/>
  <circle cx="30" cy="25" r="6" fill="#ff2bd6"/><circle cx="50" cy="25" r="6" fill="#ffd166"/><circle cx="70" cy="25" r="6" fill="#39ff88"/>
  <text x="380" y="30" text-anchor="middle" class="m d" font-size="13">chase@cyberdeck: ~/dev — zsh — 120×32</text>
  <text x="738" y="30" text-anchor="end" class="m a" font-size="12">◢◤ SECURE</text>

  <g class="m" filter="url(#txt)">
    <!-- 1 -->
    <g class="ln" style="animation-delay:.2s">
      <text x="28" y="78"><tspan class="p">➜</tspan> <tspan class="a">~/dev</tspan> <tspan class="c">whoami</tspan></text>
    </g>
    <g class="ln" style="animation-delay:.6s">
      <text x="28" y="100" class="o">Chase Tseng <tspan class="d">—</tspan> <tspan class="c">Software Engineer</tspan> <tspan class="d">· Hsinchu, TW</tspan></text>
    </g>
    <!-- 2 -->
    <g class="ln" style="animation-delay:1.1s">
      <text x="28" y="134"><tspan class="p">➜</tspan> <tspan class="a">~/dev</tspan> <tspan class="c">cat stack.json</tspan></text>
    </g>
    <g class="ln" style="animation-delay:1.5s">
      <text x="28" y="156"><tspan class="d">{</tspan> <tspan class="k">"lang"</tspan><tspan class="d">:</tspan> <tspan class="s">["python","c#","js","sql","solidity","x86"]</tspan><tspan class="d">,</tspan></text>
    </g>
    <g class="ln" style="animation-delay:1.7s">
      <text x="28" y="178"><tspan class="d">  </tspan><tspan class="k">"focus"</tspan><tspan class="d">:</tspan> <tspan class="s">["automation","rest-api","desktop-tools","bots"]</tspan> <tspan class="d">}</tspan></text>
    </g>
    <!-- 3 -->
    <g class="ln" style="animation-delay:2.2s">
      <text x="28" y="212"><tspan class="p">➜</tspan> <tspan class="a">~/dev</tspan> <tspan class="c">ls ./projects</tspan></text>
    </g>
    <g class="ln" style="animation-delay:2.6s">
      <text x="28" y="234" class="h">rfid-sync/  leave-system/  timesheet-analytics/</text>
    </g>
    <g class="ln" style="animation-delay:2.75s">
      <text x="28" y="256" class="h">nft-whitelist.sol  quant-alerts/  x86-shooter.asm</text>
    </g>
    <!-- 4 -->
    <g class="ln" style="animation-delay:3.2s">
      <text x="28" y="290"><tspan class="p">➜</tspan> <tspan class="a">~/dev</tspan> <tspan class="c">./load --modules</tspan></text>
    </g>
  </g>

  <!-- skill bars -->
  <g class="m" font-size="13">
    <g class="ln" style="animation-delay:3.5s">
      <text x="28" y="316" class="d">python</text>
      <rect x="110" y="306" width="260" height="10" rx="2" fill="#0a1f4d"/>
      <rect x="110" y="306" width="260" height="10" rx="2" fill="url(#edge)" class="bar" style="animation-delay:3.6s"/>
      <text x="380" y="316" class="p">OK</text>
      <text x="436" y="316" class="d">c#</text>
      <rect x="526" y="306" width="170" height="10" rx="2" fill="#0a1f4d"/>
      <rect x="526" y="306" width="170" height="10" rx="2" fill="url(#edge)" class="bar" style="animation-delay:3.7s"/>
      <text x="706" y="316" class="p">OK</text>
    </g>
    <g class="ln" style="animation-delay:3.8s">
      <text x="28" y="340" class="d">rest/sql</text>
      <rect x="110" y="330" width="260" height="10" rx="2" fill="#0a1f4d"/>
      <rect x="110" y="330" width="260" height="10" rx="2" fill="url(#edge)" class="bar" style="animation-delay:3.9s"/>
      <text x="380" y="340" class="p">OK</text>
      <text x="436" y="340" class="d">solidity</text>
      <rect x="526" y="330" width="170" height="10" rx="2" fill="#0a1f4d"/>
      <rect x="526" y="330" width="170" height="10" rx="2" fill="url(#edge)" class="bar" style="animation-delay:4s"/>
      <text x="706" y="340" class="p">OK</text>
    </g>
  </g>

  <g class="m ln" style="animation-delay:4.4s">
    <text x="28" y="372"><tspan class="p">➜</tspan> <tspan class="a">~/dev</tspan> <tspan class="k">build --ship</tspan> <tspan class="a blink">█</tspan></text>
  </g>

  <rect x="6" y="6" width="748" height="388" rx="10" fill="url(#tscan)"/>
</svg>
