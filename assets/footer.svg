<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="EOF — thanks for stopping by" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020817" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#04112e"/>
      <stop offset="1" stop-color="#01030c"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fg" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0e2a63" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <filter id="fglow" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="fc"><rect x="0" y="0" width="1200" height="170"/></clipPath>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .floor{animation:floor 1.4s linear infinite}
      @keyframes floor{from{transform:translateY(0)}to{transform:translateY(-14px)}}
      .flick{animation:flick 5s infinite}
      @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.3}94%{opacity:1}96%{opacity:.5}}
    </style>
  </defs>
  <rect width="1200" height="170" fill="url(#fb)"/>
  <rect width="1200" height="170" fill="url(#fg)" opacity="0.6"/>

  <!-- inverted perspective ceiling -->
  <g clip-path="url(#fc)" stroke="#00b8ff" stroke-width="1" fill="none" opacity="0.3">
    <path d="M600 170 L-600 0 M600 170 L-200 0 M600 170 L100 0 M600 170 L350 0 M600 170 L500 0 M600 170 L600 0 M600 170 L700 0 M600 170 L850 0 M600 170 L1100 0 M600 170 L1400 0 M600 170 L1800 0"/>
  </g>

  <rect x="0" y="22" width="1200" height="1.4" fill="url(#fl)" filter="url(#fglow)"/>

  <g text-anchor="middle" class="m">
    <text x="600" y="86" font-size="30" font-weight="800" letter-spacing="8" fill="#e6f6ff" filter="url(#fglow)" class="flick">
      <tspan fill="#ff2bd6">&lt;</tspan>EOF<tspan fill="#ff2bd6"> /&gt;</tspan>
    </text>
    <text x="600" y="118" font-size="14" letter-spacing="3" fill="#7dd3fc">
      $ echo "thanks for stopping by — let's build something" <tspan fill="#00e5ff" class="blink">█</tspan>
    </text>
    <text x="600" y="150" font-size="11" letter-spacing="3" fill="#3d5f9e">
      process exited with code 0 · chase5ws · 2026
    </text>
  </g>
</svg>
