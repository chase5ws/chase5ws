# Builds the small infographics shown in the profile README with lowlighter/metrics.
#
# Needs a repository secret METRICS_TOKEN: a personal access token (classic) with the
# read:user and repo scopes. Optional repository variables (Settings → Secrets and
# variables → Actions → Variables) switch on the extra cards:
#   ANILIST_USER    your AniList user name → metrics/anilist.svg (favourite anime on your profile)
#   MUSIC_PLAYLIST  a public playlist URL  → metrics/music.svg (suggested tracks)
#   MUSIC_PROVIDER  apple (default), spotify or youtube, matching MUSIC_PLAYLIST
name: Metrics
on:
  schedule:
    - cron: "17 16 * * *"   # daily, 00:17 Taipei time
  workflow_dispatch:
  # Rebuild right away whenever the README or this workflow changes, so the README
  # never points at a card that has not been generated yet.
  push:
    branches: [main]
    paths: ["README.md", ".github/workflows/metrics.yml"]

concurrency: metrics

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Check the token
        if: env.METRICS_TOKEN == ''
        run: echo "::notice::METRICS_TOKEN secret is not set, so no infographics were built."

      - name: Profile
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/profile.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Taipei
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_limit: 6

      - name: Favourite anime (AniList)
        if: env.METRICS_TOKEN != '' && vars.ANILIST_USER != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/anilist.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_anilist: yes
          plugin_anilist_user: ${{ vars.ANILIST_USER }}
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites
          plugin_anilist_limit: 13
          plugin_anilist_limit_characters: 0
          plugin_anilist_shuffle: no

      - name: Suggested tracks (playlist)
        if: env.METRICS_TOKEN != '' && vars.MUSIC_PLAYLIST != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/music.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_music: yes
          plugin_music_provider: ${{ vars.MUSIC_PROVIDER || 'apple' }}
          plugin_music_mode: playlist
          plugin_music_playlist: ${{ vars.MUSIC_PLAYLIST }}
          plugin_music_limit: 9
