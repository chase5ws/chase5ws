# Builds metrics.svg for the profile README with lowlighter/metrics.
# Needs a repository secret METRICS_TOKEN: a personal access token (classic)
# with the read:user and repo scopes (Settings → Developer settings → Tokens).
name: Metrics
on:
  schedule:
    - cron: "17 16 * * *"   # daily, 00:17 Taipei time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics.svg
          template: classic
          base: ""
          config_timezone: Asia/Taipei
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          plugin_habits_days: 30
