# Builds the small infographics shown in the profile README with lowlighter/metrics.
#
# Needs a repository secret METRICS_TOKEN: a personal access token (classic) with the
# read:user and repo scopes.
#
# Media cards at the bottom of the README, two columns floated side by side:
#   metrics/media-left.svg   suggested tracks (YouTube playlist PLefoBv28U_vI) + AniList favourite characters
#   metrics/media-right.svg  AniList favourite anime + manga (anilist.co/user/chase5ws)
# Optional repository variables MUSIC_PLAYLIST / MUSIC_PROVIDER (apple, spotify, youtube) switch the playlist.
# general.svg and achievements.svg are used by the website's "Languages & activity" window.
name: Metrics
on:
  schedule:
    - cron: "17 16 * * *"   # daily, 00:17 Taipei time
  workflow_dispatch:
  # Rebuild right away whenever the README or this workflow changes, so the README
  # never points at a card that has not been generated yet.
  push:
    branches: [main]
    paths: ["README.md", ".github/workflows/metrics.yml"]

concurrency: metrics

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Check the token
        if: env.METRICS_TOKEN == ''
        run: echo "::notice::METRICS_TOKEN secret is not set, so no infographics were built."

      - name: General
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/general.svg
          base: header
          config_timezone: Asia/Taipei
          config_order: base.header, isocalendar, languages, notable
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 4
          plugin_notable: yes

      - name: Achievements
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

      # The README shows two columns of cards, floated side by side so they line up at the top:
      #   left  = suggested tracks + favourite characters, right = favourite anime + manga.
      # extras_css hides the AniList header (genres, minutes watched) that would repeat on each card.
      - name: Left column (tracks + characters)
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/media-left.svg
          base: ""
          config_timezone: Asia/Taipei
          config_order: music, anilist
          plugin_music: yes
          plugin_music_provider: ${{ vars.MUSIC_PROVIDER || 'youtube' }}
          plugin_music_mode: playlist
          plugin_music_playlist: ${{ vars.MUSIC_PLAYLIST || 'https://music.youtube.com/playlist?list=PLefoBv28U_vI' }}
          plugin_music_limit: 6
          plugin_anilist: yes
          plugin_anilist_user: chase5ws
          plugin_anilist_sections: characters
          plugin_anilist_limit_characters: 24
          plugin_anilist_shuffle: no
          extras_css: |
            .items-wrapper section:has(> .row + .row) > h2.field, .items-wrapper section:has(> .row + .row) > .row:not(:last-of-type) { display: none !important; }

      - name: Right column (anime + manga)
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/media-right.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_anilist: yes
          plugin_anilist_user: chase5ws
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites
          plugin_anilist_limit: 13
          plugin_anilist_shuffle: no
          extras_css: |
            .items-wrapper section:has(> .row + .row) > h2.field, .items-wrapper section:has(> .row + .row) > .row:not(:last-of-type) { display: none !important; }
