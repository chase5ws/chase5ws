# Builds the infographics shown in the profile README with lowlighter/metrics.
# Needs a repository secret METRICS_TOKEN: a personal access token (classic)
# with the read:user and repo scopes (Settings → Developer settings → Tokens).
name: Metrics
on:
  schedule:
    - cron: "17 16 * * *"   # daily, 00:17 Taipei time
  workflow_dispatch:

concurrency: metrics

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Check the token
        if: env.METRICS_TOKEN == ''
        run: echo "::notice::METRICS_TOKEN secret is not set, so no infographics were built. Add it under Settings → Secrets and variables → Actions, then run this workflow again."

      - name: Overview
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/overview.svg
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: Asia/Taipei
          config_display: large

      - name: Contribution calendar
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/calendar.svg
          base: ""
          config_timezone: Asia/Taipei
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      - name: Habits
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/habits.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30

      - name: Achievements
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Taipei
          config_display: large
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_secrets: no
