# Builds the small infographics shown in the profile README with lowlighter/metrics.
# Same layout as github.com/lowlighter: several separate 390px-wide cards that the
# README floats into two columns (align=left / align=right), not one big image.
#
# Needs a repository secret METRICS_TOKEN: a personal access token (classic) with the
# read:user and repo scopes. Optional repository variables (Settings → Secrets and
# variables → Actions → Variables) switch on the extra cards:
#   MUSIC_PLAYLIST  another public playlist URL → metrics/music.svg (suggested tracks)
# AniList favourites come from anilist.co/user/chase5ws → metrics/{anime,manga,characters}.svg.
# Suggested tracks come from the YouTube playlist PLefoBv28U_vI (MUSIC_PLAYLIST / MUSIC_PROVIDER override it).
#   MUSIC_PROVIDER  apple (default), spotify or youtube, matching MUSIC_PLAYLIST
name: Metrics
on:
  schedule:
    - cron: "17 16 * * *"   # daily, 00:17 Taipei time
  workflow_dispatch:
  # Rebuild right away whenever the README or this workflow changes, so the README
  # never points at a card that has not been generated yet.
  push:
    branches: [main]
    paths: ["README.md", ".github/workflows/metrics.yml"]

concurrency: metrics

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Check the token
        if: env.METRICS_TOKEN == ''
        run: echo "::notice::METRICS_TOKEN secret is not set, so no infographics were built."

      - name: General
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/general.svg
          base: header
          config_timezone: Asia/Taipei
          config_order: base.header, isocalendar, languages, notable
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_details: percentage
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 4
          plugin_notable: yes

      - name: Achievements
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

      - name: AniList favourite anime
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/anime.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_anilist: yes
          plugin_anilist_user: chase5ws
          plugin_anilist_shuffle: no
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites
          plugin_anilist_limit: 13
      - name: AniList favourite manga
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/manga.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_anilist: yes
          plugin_anilist_user: chase5ws
          plugin_anilist_shuffle: no
          plugin_anilist_medias: manga
          plugin_anilist_sections: favorites
          plugin_anilist_limit: 13
      - name: AniList favourite characters
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/characters.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_anilist: yes
          plugin_anilist_user: chase5ws
          plugin_anilist_shuffle: no
          plugin_anilist_sections: characters
          plugin_anilist_limit_characters: 22
      - name: Suggested tracks (YouTube playlist)
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: chase5ws
          filename: metrics/music.svg
          base: ""
          config_timezone: Asia/Taipei
          plugin_music: yes
          plugin_music_provider: ${{ vars.MUSIC_PROVIDER || 'youtube' }}
          plugin_music_mode: playlist
          plugin_music_playlist: ${{ vars.MUSIC_PLAYLIST || 'https://music.youtube.com/playlist?list=PLefoBv28U_vI' }}
          plugin_music_limit: 9
